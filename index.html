<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#17365d">
<link rel="manifest" href="manifest.json">

<title>Checklist de Inspeção de Alojamento</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
background:#f3f5f7;
font-family:Arial,Helvetica,sans-serif;
color:#17202a;
}

.container{
max-width:720px;
margin:auto;
padding:12px;
}

.header{
background:#17365d;
color:white;
border-radius:16px;
padding:20px;
margin-bottom:14px;
}

.header h1{
margin:0;
font-size:21px;
}

.header p{
margin:7px 0 0;
font-size:13px;
}

.progress{
height:9px;
background:#dfe4e8;
border-radius:20px;
overflow:hidden;
margin-top:15px;
}

.progress-bar{
height:100%;
width:0%;
background:white;
transition:.3s;
}

.progress-text{
font-size:12px;
margin-top:6px;
}

.card{
background:white;
border-radius:16px;
padding:16px;
margin-bottom:14px;
box-shadow:0 2px 10px rgba(0,0,0,.06);
}

.title{
font-size:17px;
font-weight:bold;
margin-bottom:12px;
}

label{
display:block;
font-size:13px;
font-weight:bold;
margin-top:12px;
margin-bottom:5px;
}

input,
textarea{
width:100%;
padding:12px;
border:1px solid #ccd3da;
border-radius:10px;
font-size:16px;
font-family:Arial,sans-serif;
}

textarea{
min-height:75px;
resize:vertical;
}

.categoria{
background:#e9eef5;
color:#17365d;
border-radius:11px;
padding:12px;
margin-top:20px;
margin-bottom:8px;
font-weight:bold;
font-size:15px;
}

.item{
background:white;
border:1px solid #dfe4e8;
border-radius:14px;
padding:13px;
margin-bottom:9px;
}

.item-texto{
font-weight:bold;
font-size:15px;
line-height:1.4;
margin-bottom:12px;
}

.opcoes{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:7px;
}

.opcao{
position:relative;
}

.opcao input{
position:absolute;
opacity:0;
}

.opcao span{
display:block;
text-align:center;
padding:11px 5px;
border:1px solid #ccd3da;
border-radius:10px;
font-weight:bold;
cursor:pointer;
}

.opcao input:checked+span{
background:#17365d;
color:white;
border-color:#17365d;
}

.nc-area{
display:none;
margin-top:10px;
padding:10px;
background:#fff5f5;
border-radius:10px;
border:1px solid #f0c5c5;
}

.nc-area.visivel{
display:block;
}

.nc-titulo{
color:#9c2c2c;
font-weight:bold;
font-size:13px;
margin-bottom:8px;
}

.foto-botao{
display:block;
width:100%;
padding:13px;
text-align:center;
border:1px dashed #8b969f;
border-radius:10px;
cursor:pointer;
font-weight:bold;
background:white;
}

.foto-botao input{
display:none;
}

.foto-preview,
.foto-identificacao{
display:none;
width:100%;
max-height:280px;
object-fit:contain;
margin-top:8px;
border-radius:10px;
border:1px solid #ccc;
}

.assinatura{
width:100%;
height:190px;
border:1px solid #ccd3da;
border-radius:12px;
background:#fafafa;
touch-action:none;
}

.limpar{
text-align:right;
margin-top:7px;
}

button{
border:none;
border-radius:11px;
padding:13px 17px;
font-size:15px;
font-weight:bold;
cursor:pointer;
}

.btn-limpar{
background:#e8edf2;
}

.btn-enviar{
width:100%;
background:#17365d;
color:white;
font-size:17px;
}

.btn-pdf{
display:block;
width:100%;
text-align:center;
background:#17365d;
color:white;
text-decoration:none;
padding:14px;
border-radius:11px;
font-weight:bold;
margin-top:10px;
}

.mensagem{
display:none;
padding:14px;
border-radius:12px;
margin-bottom:14px;
}

.erro{
background:#fdeaea;
border:1px solid #efb0b0;
color:#8b2424;
}

.sucesso{
background:#e7f6ec;
border:1px solid #a9d8b6;
color:#1f6b35;
}

.observacao-geral{
min-height:120px;
}

@media print{

body{
background:white;
}

.container{
max-width:none;
padding:0;
}

.nao-imprimir{
display:none!important;
}

.card,
.item{
box-shadow:none;
}

.item{
break-inside:avoid;
}

.categoria{
break-after:avoid;
}

textarea,
input{
border:none;
padding:2px;
}

.foto-preview,
.foto-identificacao{
display:block!important;
}

}
</style>
</head>

<body>

<div class="container">

<div class="header">

<h1>
Checklist de Inspeção de Alojamento
</h1>

<p>
Aplicativo offline
</p>

<div class="progress">

<div
id="barra"
class="progress-bar">
</div>

</div>

<div
id="progresso"
class="progress-text">

0 itens respondidos

</div>

</div>

<div
id="erro"
class="mensagem erro">
</div>

<div
id="sucesso"
class="mensagem sucesso">
</div>

<form id="form">

<div class="card">

<div class="title">
Dados da inspeção
</div>

<label>
Alojamento *
</label>

<input
id="alojamento"
required
placeholder="Nome ou identificação">

<label>
Foto de identificação do alojamento
</label>

<label class="foto-botao">

📷 Tirar / anexar foto do alojamento

<input
type="file"
accept="image/*"
capture="environment"
onchange="fotoAlojamento(this)">

</label>

<img
id="fotoAlojamentoPreview"
class="foto-identificacao">

<label>
Endereço *
</label>

<input
id="endereco"
required
placeholder="Endereço">

<label>
Inspetor *
</label>

<input
id="inspetor"
required
placeholder="Nome do inspetor">

<label>
Responsável *
</label>

<input
id="responsavel"
required
placeholder="Nome do responsável">

<label>
Data *
</label>

<input
id="data"
type="date"
required>

<label>
Horário *
</label>

<input
id="horario"
type="time"
required>

</div>

<div id="checklist"></div>

<div class="card">

<div class="title">
Observação geral
</div>

<label>
Informações gerais da inspeção, quando necessário.
</label>

<textarea
id="observacaoGeral"
class="observacao-geral"
placeholder="Digite aqui...">
</textarea>

</div>

<div class="card">

<div class="title">
Assinatura do responsável *
</div>

<canvas
id="assinatura"
class="assinatura">
</canvas>

<div class="limpar">

<button
type="button"
class="btn-limpar"
onclick="limparAssinatura()">

Limpar assinatura

</button>

</div>

</div>

<div class="card nao-imprimir">

<button
type="button"
id="finalizar"
class="btn-enviar"
onclick="finalizar()">

📄 Gerar relatório PDF

</button>

<div
id="acoes"
style="display:none">

<a
href="#"
class="btn-pdf"
onclick="abrirPDF(event)">

📄 SALVAR / GERAR PDF

</a>

</div>

</div>

</form>

</div>

<script>

/* ============================================================
   ITENS DO CHECKLIST
   ============================================================ */

const itens = [

["DORMITÓRIOS","Limpeza"],
["DORMITÓRIOS","Organização"],
["DORMITÓRIOS","Ventilação"],
["DORMITÓRIOS","Iluminação"],
["DORMITÓRIOS","Camas"],
["DORMITÓRIOS","Colchões"],
["DORMITÓRIOS","Roupa de cama"],
["DORMITÓRIOS","Armários"],
["DORMITÓRIOS","Tomadas"],
["DORMITÓRIOS","Janelas"],
["DORMITÓRIOS","Portas"],
["DORMITÓRIOS","Área mínima NR-24"],

["ÁREA COMUM","TV"],
["ÁREA COMUM","Wi-Fi"],
["ÁREA COMUM","Assentos"],
["ÁREA COMUM","Quadro de Gestão"],

["SANITÁRIOS","Limpeza"],
["SANITÁRIOS","Vasos"],
["SANITÁRIOS","Lavatórios"],
["SANITÁRIOS","Chuveiros"],
["SANITÁRIOS","Água"],
["SANITÁRIOS","Sabonete"],
["SANITÁRIOS","Papel"],
["SANITÁRIOS","Espelhos"],
["SANITÁRIOS","Ralos"],
["SANITÁRIOS","Lixeiras"],

["COZINHA / REFEITÓRIO","Limpeza"],
["COZINHA / REFEITÓRIO","Mesas"],
["COZINHA / REFEITÓRIO","Assentos"],
["COZINHA / REFEITÓRIO","Bebedouro"],
["COZINHA / REFEITÓRIO","Água potável"],
["COZINHA / REFEITÓRIO","Geladeira"],
["COZINHA / REFEITÓRIO","Fogão"],
["COZINHA / REFEITÓRIO","Gás (Vazilhame externo)"],
["COZINHA / REFEITÓRIO","Higiene"],

["LAVANDERIA","Lavadora"],
["LAVANDERIA","Varal"],
["LAVANDERIA","Drenagem"],
["LAVANDERIA","Organização"],

["SEGURANÇA","Extintores"],
["SEGURANÇA","Sinalização"],
["SEGURANÇA","Iluminação emergência"],
["SEGURANÇA","Saídas"],
["SEGURANÇA","Primeiros socorros"],
["SEGURANÇA","Instalações elétricas"],
["SEGURANÇA","Pragas"],
["SEGURANÇA","Resíduos"],

["GESTÃO","Normas"],
["GESTÃO","Canal denúncia"],
["GESTÃO","Contatos de Emergências"],
["GESTÃO","Álcool e drogas"],
["GESTÃO","Assédio/Exploração infantil"],
["GESTÃO","Regras para boa convivência"],
["GESTÃO","Ficha limpeza"]

];


/* ============================================================
   VARIÁVEIS
   ============================================================ */

let respostas = {};

let fotos = {};

let fotoId = null;

let canvas;

let ctx;

let desenhando = false;

let assinou = false;


/* ============================================================
   ESCAPAR TEXTO
   ============================================================ */

function esc(texto){

return String(texto || "")

.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


/* ============================================================
   INICIAR
   ============================================================ */

function iniciar(){

const agora = new Date();

document
.getElementById("data")
.value =
agora.toISOString().slice(0,10);

document
.getElementById("horario")
.value =
String(
agora.getHours()
).padStart(2,"0")
+
":"
+
String(
agora.getMinutes()
).padStart(2,"0");


let html = "";

let categoriaAtual = "";


itens.forEach(
function(item,indice){

if(
item[0] !== categoriaAtual
){

categoriaAtual =
item[0];

html += `

<div class="categoria">

${esc(categoriaAtual)}

</div>

`;

}


html += `

<div class="item">

<div class="item-texto">

${indice + 1}.
${esc(item[1])}

</div>

<div class="opcoes">

<label class="opcao">

<input
type="radio"
name="r${indice}"
onchange="resultado(${indice},'C')">

<span>C</span>

</label>

<label class="opcao">

<input
type="radio"
name="r${indice}"
onchange="resultado(${indice},'NC')">

<span>NC</span>

</label>

<label class="opcao">

<input
type="radio"
name="r${indice}"
onchange="resultado(${indice},'NA')">

<span>NA</span>

</label>

</div>


<div
id="nc${indice}"
class="nc-area">

<div class="nc-titulo">

⚠ NÃO CONFORMIDADE

</div>


<label>

Justificativa da NC *

</label>


<textarea
id="j${indice}"
placeholder="Descreva a irregularidade encontrada">
</textarea>


<label class="foto-botao">

📷 Tirar / anexar foto da irregularidade

<input
type="file"
accept="image/*"
capture="environment"
onchange="fotoNC(${indice},this)">

</label>


<img
id="p${indice}"
class="foto-preview">

</div>

</div>

`;

});


document
.getElementById("checklist")
.innerHTML =
html;


prepararAssinatura();

atualizar();

}


/* ============================================================
   RESULTADO
   ============================================================ */

function resultado(indice,valor){

respostas[indice] =
valor;

document
.getElementById(
"nc" + indice
)
.classList
.toggle(
"visivel",
valor === "NC"
);

atualizar();

}


/* ============================================================
   FOTO DO ALOJAMENTO
   ============================================================ */

function fotoAlojamento(input){

if(
!input.files ||
!input.files[0]
){

return;

}


const leitor =
new FileReader();


leitor.onload =
function(event){

fotoId =
event.target.result;


const preview =
document.getElementById(
"fotoAlojamentoPreview"
);

preview.src =
event.target.result;

preview.style.display =
"block";

};


leitor.readAsDataURL(
input.files[0]
);

}


/* ============================================================
   FOTO DA NC
   ============================================================ */

function fotoNC(indice,input){

if(
!input.files ||
!input.files[0]
){

return;

}


const leitor =
new FileReader();


leitor.onload =
function(event){

fotos[indice] =
event.target.result;


const preview =
document.getElementById(
"p" + indice
);

preview.src =
event.target.result;

preview.style.display =
"block";

};


leitor.readAsDataURL(
input.files[0]
);

}


/* ============================================================
   PROGRESSO
   ============================================================ */

function atualizar(){

const respondidos =
Object.keys(
respostas
).length;

const percentual =
Math.round(
respondidos /
itens.length *
100
);


document
.getElementById("barra")
.style.width =
percentual + "%";


document
.getElementById("progresso")
.textContent =

respondidos +
" de " +
itens.length +
" itens respondidos (" +
percentual +
"%)";

}


/* ============================================================
   ASSINATURA
   ============================================================ */

function prepararAssinatura(){

canvas =
document.getElementById(
"assinatura"
);

ctx =
canvas.getContext(
"2d"
);


const proporcao =
window.devicePixelRatio || 1;


canvas.width =
canvas.offsetWidth *
proporcao;

canvas.height =
canvas.offsetHeight *
proporcao;


ctx.scale(
proporcao,
proporcao
);


ctx.lineWidth = 2;

ctx.lineCap =
"round";


canvas.addEventListener(
"pointerdown",
function(event){

desenhando = true;

assinou = true;

const rect =
canvas.getBoundingClientRect();

ctx.beginPath();

ctx.moveTo(
event.clientX -
rect.left,
event.clientY -
rect.top
);

}
);


canvas.addEventListener(
"pointermove",
function(event){

if(!desenhando){

return;

}


const rect =
canvas.getBoundingClientRect();


ctx.lineTo(
event.clientX -
rect.left,
event.clientY -
rect.top
);

ctx.stroke();

}
);


[
"pointerup",
"pointerleave",
"pointercancel"
]
.forEach(
function(evento){

canvas.addEventListener(
evento,
function(){

desenhando = false;

}
);

}
);

}


/* ============================================================
   LIMPAR ASSINATURA
   ============================================================ */

function limparAssinatura(){

ctx.clearRect(
0,
0,
canvas.width,
canvas.height
);

assinou = false;

}


/* ============================================================
   ERRO
   ============================================================ */

function mostrarErro(mensagem){

const elemento =
document.getElementById(
"erro"
);

elemento.textContent =
mensagem;

elemento.style.display =
"block";


window.scrollTo({
top:0,
behavior:"smooth"
});

}


/* ============================================================
   FINALIZAR
   ============================================================ */

function finalizar(){

document
.getElementById("erro")
.style.display =
"none";


document
.getElementById("sucesso")
.style.display =
"none";


const campos = [

"alojamento",
"endereco",
"inspetor",
"responsavel",
"data",
"horario"

];


for(
const id of campos
){

const campo =
document.getElementById(id);


if(
!campo.value.trim()
){

mostrarErro(
"Preencha todos os campos obrigatórios."
);

campo.focus();

return;

}

}


/* Todos os itens */

if(
Object.keys(respostas).length !==
itens.length
){

mostrarErro(
"É necessário responder todos os itens do checklist."
);

return;

}


/* NC */

for(
let i = 0;
i < itens.length;
i++
){

if(
respostas[i] === "NC"
){

const justificativa =
document.getElementById(
"j" + i
);


if(
!justificativa.value.trim()
){

mostrarErro(
"Existe uma NC sem justificativa."
);

justificativa.focus();

return;

}

}

}


/* Assinatura */

if(!assinou){

mostrarErro(
"A assinatura do responsável é obrigatória."
);

return;

}


const sucesso =
document.getElementById(
"sucesso"
);


sucesso.innerHTML =

"<strong>Inspeção concluída!</strong>"
+
"<br><br>"
+
"Toque em "
+
"<strong>SALVAR / GERAR PDF</strong>"
+
" para abrir o relatório.";


sucesso.style.display =
"block";


document
.getElementById("acoes")
.style.display =
"block";


window.scrollTo({
top:0,
behavior:"smooth"
});

}


/* ============================================================
   GERAR RELATÓRIO
   ============================================================ */

function abrirPDF(event){

event.preventDefault();


const alojamento =
document
.getElementById("alojamento")
.value;

const endereco =
document
.getElementById("endereco")
.value;

const inspetor =
document
.getElementById("inspetor")
.value;

const responsavel =
document
.getElementById("responsavel")
.value;

const data =
document
.getElementById("data")
.value;

const horario =
document
.getElementById("horario")
.value;

const observacao =
document
.getElementById("observacaoGeral")
.value;


/* Contagem */

let conformes = 0;

let naoConformes = 0;

let naoAplicaveis = 0;


Object
.values(respostas)
.forEach(
function(resultado){

if(
resultado === "C"
){

conformes++;

}

else if(
resultado === "NC"
){

naoConformes++;

}

else if(
resultado === "NA"
){

naoAplicaveis++;

}

}
);


/* HTML DO RELATÓRIO */

let html = `

<!DOCTYPE html>

<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1">

<title>
Relatório - ${esc(alojamento)}
</title>


<style>

@page{

size:A4;

margin:12mm;

}


body{

font-family:
Arial,
Helvetica,
sans-serif;

color:#17202a;

font-size:12px;

margin:0;

background:white;

}


.header{

background:#17365d;

color:white;

padding:18px;

border-radius:10px;

margin-bottom:15px;

}


.header h1{

margin:0;

font-size:20px;

}


.titulo{

background:#17365d;

color:white;

padding:8px;

font-weight:bold;

margin-top:14px;

border-radius:6px;

}


.info{

width:100%;

border-collapse:collapse;

margin-top:8px;

}


.info td{

border:1px solid #ccc;

padding:7px;

}


.label{

font-weight:bold;

width:30%;

background:#f1f3f5;

}


.resumo{

display:grid;

grid-template-columns:
repeat(3,1fr);

gap:8px;

margin-top:10px;

}


.resumo div{

padding:12px;

border:1px solid #ccc;

border-radius:7px;

font-weight:bold;

}


.item{

border:1px solid #ccc;

border-radius:7px;

padding:9px;

margin-top:8px;

break-inside:avoid;

}


.item-c{

border-left:5px solid #218838;

}


.item-nc{

border-left:5px solid #dc3545;

background:#fff5f5;

}


.item-na{

border-left:5px solid #777;

background:#f5f5f5;

}


.nc{

margin-top:7px;

padding:8px;

background:#fff0f0;

border-radius:5px;

}


.obs{

margin-top:7px;

padding:8px;

background:#f6f6f6;

white-space:pre-wrap;

border-radius:5px;

}


.foto{

max-width:100%;

max-height:350px;

margin-top:8px;

border:1px solid #aaa;

border-radius:5px;

}


.fotoId{

display:block;

max-width:100%;

max-height:400px;

margin:10px auto;

border:1px solid #aaa;

border-radius:5px;

}


.assinatura{

text-align:center;

margin-top:20px;

}


.assinatura img{

max-width:400px;

max-height:180px;

}


.acoes{

text-align:center;

margin:20px 0;

}


.botao{

background:#17365d;

color:white;

border:0;

padding:14px 20px;

font-weight:bold;

}


@media print{

.acoes{

display:none;

}

}

</style>

</head>


<body>


<div class="header">

<h1>
CHECKLIST DE INSPEÇÃO DE ALOJAMENTO
</h1>

<p>
<b>Alojamento:</b>

</p>

<p>

<b>Data:</b>

&nbsp;&nbsp;

<b>Horário:</b>
${esc(horario)}
